name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  slice-pr-contract:
    name: Slice PR Contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test workflow validators
        run: node --test .github/scripts/validate-pr-contract.test.mjs .github/scripts/validate-slice-readiness.test.mjs
      - name: Validate pull request contract
        run: node .github/scripts/validate-pr-contract.mjs "$GITHUB_EVENT_PATH"

  quality:
    name: .NET quality checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.400
      - name: Restore
        run: dotnet restore CivicAction.slnx
      - name: Verify formatting
        run: dotnet format CivicAction.slnx --verify-no-changes --severity info
      - name: Build
        run: dotnet build CivicAction.slnx --no-restore
      - name: Test
        run: dotnet test CivicAction.slnx --no-build
